<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>シンプルTodoマネージャー</title>
  <style>
    /* 1. 背景とフォントをすっきり整える */
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #f1f5f9; /* やわらかい薄青グレー */
      color: #334155;
      padding: 40px 16px;
      margin: 0;
    }

    /* 2. メイン枠（丸みと綺麗な影を付ける） */
    .container {
      max-width: 400px;
      margin: 0 auto;
      background: #ffffff;
      padding: 24px;
      border-radius: 12px;
      box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.05), 0 4px 6px -2px rgba(0, 0, 0, 0.02);
    }

    /* 3. 見出し（ワンポイントの線を追加） */
    h1 {
      font-size: 1.25rem;
      color: #1e293b;
      margin-top: 0;
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    h1::before {
      content: "";
      display: inline-block;
      width: 4px;
      height: 18px;
      background-color: #6366f1; /* パープル系のアクセント */
      border-radius: 2px;
    }

    /* 4. タスクリスト（カード型のデザインに） */
    .task-list {
      list-style: none;
      padding: 0;
      margin: 0;
    }

    .task-item {
      display: flex;
      align-items: center;
      padding: 12px 14px;
      margin-bottom: 8px;
      background-color: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      font-size: 0.95rem;
      transition: background-color 0.2s ease;
    }

    /* マウスを乗せたときに少し色を変える */
    .task-item:hover {
      background-color: #f1f5f9;
    }

    /* チェックボックス風の丸アイコン */
    .task-item::before {
      content: "";
      display: inline-block;
      width: 16px;
      height: 16px;
      margin-right: 12px;
      border: 2px solid #94a3b8;
      border-radius: 50%;
      flex-shrink: 0;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>未完了のタスク一覧</h1>
    <!-- ここにJavaScriptでタスクが追加されます -->
    <ul id="taskList" class="task-list"></ul>
  </div>

  <script>
    // 1. データの準備
    let tasks = [
      { name: '牛乳を買う',    isDone: false },
      { name: '風呂掃除をする', isDone: true  },
      { name: '本を読む',      isDone: false },
    ];

    // 2. 状態判定用の関数
    function isDone(task) {
      return task.isDone;
    }
    function isNotDone(task) {
      return !isDone(task);
    }

    // 3. 画面に描画する処理
    function renderTasks() {
      const listElement = document.getElementById('taskList');
      listElement.innerHTML = ''; // クリア処理を追加
      
      // 未完了のタスクだけを filter で抽出
      const activeTasks = tasks.filter(isNotDone);

      // 抽出したタスクをループして HTML 要素を作成
      activeTasks.forEach(task => {
        const li = document.createElement('li');
        li.className = 'task-item';
        li.textContent = task.name;
        listElement.appendChild(li);
      });
    }

    // 処理を実行
    renderTasks();
  </script>
</body>
</html>
